# Fixture for mc-bump's own self-test. Kept on the same versions as a real mod so
# the pipeline resolves and boots something realistic; mc-bump.py rewrites these
# exactly as it would anywhere else.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.18
java_version=25

mod_version=26.2-1.0.0
maven_group=com.spatulox.mcbumptest
archives_base_name=mc-bump-testmod

fabric_api_version=0.156.0+26.2

# No store ids: the testmod is never published. release.yml is not self-tested for
# that reason — it would need throwaway store projects, which is a different
# problem from proving the pipeline works.
supported_minecraft_versions=26.2
