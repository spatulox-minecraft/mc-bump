name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + headless server
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      # java_version is derived from the Minecraft version by
      # scripts/update-mc-version.py, so the JDK follows a Minecraft bump on its own.
      - name: Read the Java version
        id: java
        run: echo "version=$(sed -n 's/^java_version=//p' gradle.properties | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.java.outputs.version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Headless server test
        run: bash .github/scripts/headless-server-test.sh

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs
          path: |
            server-test.log
            run/logs/
          retention-days: 7
          if-no-files-found: ignore
