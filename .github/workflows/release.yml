name: mc-bump release

# Publishes the mod to each configured store, then tags the commit.
#
# The trigger is mod_version, not "the claimed versions grew": the tag carries
# mod_version, so it is the only field that guarantees a unique name, and it
# covers a manual release (1.1.0 -> 1.2.0 with no Minecraft change) too.
#
# The tag means "this version is RELEASED", and is therefore pushed AFTER a
# successful upload. That ordering is what makes a failure recoverable: no tag is
# left behind, so re-running simply tries again.
#
# One job per store, and each one is individually replayable. That is not
# cosmetic: with a single publish task, Modrinth succeeding and CurseForge
# failing left the run with no tag, and every re-run hit "version already exists"
# on Modrinth — the pipeline could never finish again without a human. A marker
# tag per store is what makes a re-run skip what is already out there.
#
# `github` is the exception to that ordering: a GitHub release hangs off the tag,
# so it can only be created after it. It stays replayable by ignoring the
# "already released" verdict and asking `gh release view` instead.

on:
  workflow_call:
    inputs:
      mc-bump-ref:
        type: string
        default: v1
        required: false
      dry-run:
        description: Do everything except the uploads and the tag.
        type: boolean
        default: false
        required: false
    secrets:
      MODRINTH_TOKEN:
        required: false
      CURSEFORGE_TOKEN:
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  # cancel-in-progress stays false: an upload must never be cut in flight.
  group: mc-bump-release
  cancel-in-progress: false

jobs:
  config:
    name: Read the config
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.setup.outputs.release }}
      stores: ${{ steps.setup.outputs.stores }}
      versions: ${{ steps.setup.outputs.versions }}
      java: ${{ steps.setup.outputs.java }}
      tag: ${{ steps.setup.outputs.tag }}
      mod_version: ${{ steps.setup.outputs.mod_version }}
      minecraft: ${{ steps.setup.outputs.minecraft }}
      assignee: ${{ steps.setup.outputs.assignee }}
      label: ${{ steps.setup.outputs.label }}
      log_tail: ${{ steps.setup.outputs.log_tail }}
      retention_days: ${{ steps.setup.outputs.retention_days }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: spatulox-minecraft/mc-bump
          ref: ${{ inputs.mc-bump-ref }}
          path: .mc-bump
      - id: setup
        uses: ./.mc-bump/.github/actions/setup

  # Refuses early and writes nothing. The expensive matrix below only starts once
  # every guard is cleared — including the secrets, which used to be discovered
  # missing after ninety minutes of testing.
  check:
    name: Should we publish?
    needs: config
    if: needs.config.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          # the existing tags are needed to know whether this version is already out
          fetch-depth: 0

      - name: Check the version, the claims and the secrets
        id: check
        env:
          TAG: ${{ needs.config.outputs.tag }}
          MC: ${{ needs.config.outputs.minecraft }}
          MOD_VERSION: ${{ needs.config.outputs.mod_version }}
          STORES: ${{ needs.config.outputs.stores }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          set -euo pipefail

          # Idempotent: "the release tag does not exist yet" is the whole
          # condition, and it is safe to replay.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "### \`$TAG\` is already released, nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Merging a DRAFT pull request (the matrix failed) leaves
          # minecraft_version bumped while the revert restored the previous,
          # shorter supported_minecraft_versions. Publishing then would ship a jar
          # built against the new version while announcing the old one.
          SUPPORTED="$(sed -n 's/^supported_minecraft_versions=//p' gradle.properties | head -n 1 | tr -d '[:space:]')"
          case ",$SUPPORTED," in
            *",$MC,"*) ;;
            *)
              echo "::error::minecraft_version=$MC is not in supported_minecraft_versions=$SUPPORTED: compatibility was never proven, refusing to publish"
              exit 1
              ;;
          esac

          # A token missing or expired is a two second check here, or a ninety
          # minute one after the matrix. `github` is absent on purpose: it
          # publishes with github.token, which is always there.
          MISSING=""
          case ",$STORES," in
            *,modrinth,*)   [ -n "${MODRINTH_TOKEN:-}" ]   || MISSING="$MISSING MODRINTH_TOKEN" ;;
          esac
          case ",$STORES," in
            *,curseforge,*) [ -n "${CURSEFORGE_TOKEN:-}" ] || MISSING="$MISSING CURSEFORGE_TOKEN" ;;
          esac
          if [ -n "$MISSING" ]; then
            echo "::error::release.stores lists $STORES but these secrets are empty:$MISSING"
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Releasing \`$TAG\` :rocket:"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Minecraft | \`$MC\` |"
            echo "| announced | \`$SUPPORTED\` |"
            echo "| stores | \`$STORES\` |"
            echo "| dry run | \`${{ inputs.dry-run }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The matrix, not a single smoke test: it proves every version listed in
  # supported_minecraft_versions, which is exactly what the stores announce.
  # Proving only the newest would publish claims about the rest.
  matrix:
    name: Build + server (${{ matrix.minecraft }})
    needs: [config, check]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        minecraft: ${{ fromJson(needs.config.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: spatulox-minecraft/mc-bump
          ref: ${{ inputs.mc-bump-ref }}
          path: .mc-bump

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ needs.config.outputs.java }}
      - uses: gradle/actions/setup-gradle@v5

      - name: Install PyYAML
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build "-Pminecraft_version=${{ matrix.minecraft }}" \
            --stacktrace --console=plain 2>&1 | tee "build-${{ matrix.minecraft }}.log"

      - name: Headless server
        id: server
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          LOG: server-test-${{ matrix.minecraft }}.log
          EXPECTED_MC: ${{ matrix.minecraft }}
          GRADLE_ARGS: -Pminecraft_version=${{ matrix.minecraft }}
        run: python3 .mc-bump/scripts/headless-server-test.py

      - name: Assemble the log to report
        if: always()
        env:
          MC: ${{ matrix.minecraft }}
        run: cat "build-$MC.log" "server-test-$MC.log" > "matrix-$MC.log" 2>/dev/null || true

      - if: always()
        uses: ./.mc-bump/.github/actions/report
        with:
          name: matrix-${{ matrix.minecraft }}
          title: ${{ steps.build.outcome != 'success' && format('Build — Minecraft {0}', matrix.minecraft) || format('Headless server — Minecraft {0}', matrix.minecraft) }}
          kind: ${{ steps.build.outcome != 'success' && 'build' || 'server' }}
          outcome: ${{ steps.build.outcome == 'success' && steps.server.outcome || steps.build.outcome }}
          log: matrix-${{ matrix.minecraft }}.log
          retention-days: ${{ needs.config.outputs.retention_days }}

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-logs-${{ matrix.minecraft }}
          path: |
            build-${{ matrix.minecraft }}.log
            server-test-${{ matrix.minecraft }}.log
            run/logs/
          retention-days: ${{ needs.config.outputs.retention_days }}
          if-no-files-found: ignore

      - name: Fail when this version is broken
        if: steps.build.outcome != 'success' || steps.server.outcome != 'success'
        run: exit 1

  publish-modrinth:
    name: Publish to Modrinth
    needs: [config, check, matrix]
    if: needs.check.outputs.publish == 'true' && contains(needs.config.outputs.stores, 'modrinth')
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.marker.outputs.skip == 'true' && 'skipped' || 'published' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A marker tag rather than an API call: the same mechanism has to work for
      # both stores, and CurseForge's listing API needs a separate "core" key that
      # the upload token is not. `git ls-remote` costs no secret at all.
      - name: Has this version already been uploaded?
        id: marker
        env:
          MARKER: published/modrinth/${{ needs.config.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$(git ls-remote --tags origin "refs/tags/$MARKER")" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "### Modrinth: \`$MARKER\` already exists, skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.marker.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: ${{ needs.config.outputs.java }}
      - uses: gradle/actions/setup-gradle@v5
        if: steps.marker.outputs.skip != 'true'

      - name: Upload
        if: steps.marker.outputs.skip != 'true' && inputs.dry-run != true
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew modrinth --stacktrace

      - name: Build only (dry run)
        if: steps.marker.outputs.skip != 'true' && inputs.dry-run == true
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
          echo "### Dry run: Modrinth upload skipped." >> "$GITHUB_STEP_SUMMARY"

      # AFTER the upload, for the same reason the release tag is pushed after the
      # publication: a marker means "this is out there".
      - name: Mark it as published
        if: steps.marker.outputs.skip != 'true' && inputs.dry-run != true
        env:
          MARKER: published/modrinth/${{ needs.config.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$MARKER"
          git push origin "$MARKER"

  publish-curseforge:
    name: Publish to CurseForge
    needs: [config, check, matrix]
    if: needs.check.outputs.publish == 'true' && contains(needs.config.outputs.stores, 'curseforge')
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.marker.outputs.skip == 'true' && 'skipped' || 'published' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Has this version already been uploaded?
        id: marker
        env:
          MARKER: published/curseforge/${{ needs.config.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$(git ls-remote --tags origin "refs/tags/$MARKER")" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "### CurseForge: \`$MARKER\` already exists, skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.marker.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: ${{ needs.config.outputs.java }}
      - uses: gradle/actions/setup-gradle@v5
        if: steps.marker.outputs.skip != 'true'

      - name: Upload
        if: steps.marker.outputs.skip != 'true' && inputs.dry-run != true
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew publishCurseForge --stacktrace

      - name: Build only (dry run)
        if: steps.marker.outputs.skip != 'true' && inputs.dry-run == true
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
          echo "### Dry run: CurseForge upload skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Mark it as published
        if: steps.marker.outputs.skip != 'true' && inputs.dry-run != true
        env:
          MARKER: published/curseforge/${{ needs.config.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$MARKER"
          git push origin "$MARKER"

  # Only reached once every enabled store is done: the tag records a release, not
  # a merge. `skipped` counts as done — that store simply had nothing left to do.
  tag:
    name: Tag the released version
    needs: [config, check, publish-modrinth, publish-curseforge]
    if: >-
      always()
      && needs.check.outputs.publish == 'true'
      && inputs.dry-run != true
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: spatulox-minecraft/mc-bump
          ref: ${{ inputs.mc-bump-ref }}
          path: .mc-bump

      - name: Install PyYAML
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Create the tag
        env:
          TAG: ${{ needs.config.outputs.tag }}
        run: |
          set -euo pipefail
          prop() { sed -n "s/^$1=//p" gradle.properties | head -n 1 | tr -d '[:space:]'; }

          MC="$(prop minecraft_version)"
          SUPPORTED="$(prop supported_minecraft_versions)"
          JAVA="$(prop java_version)"
          RANGE="$(PYTHONPATH=.mc-bump python3 -c "
          from lib.config import load
          project = load()
          print(project.loader.read_depends(project.paths, project.loader.depends_keys()['minecraft']))
          ")"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Minecraft $MC" \
            -m "supported_minecraft_versions: $SUPPORTED
          compatibility range: $RANGE
          java: $JAVA"
          git push origin "$TAG"

          {
            echo "### Tag \`$TAG\` created :label:"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Minecraft | \`$MC\` |"
            echo "| supported | \`$SUPPORTED\` |"
            echo "| range | \`$RANGE\` |"
            echo "| Java | \`$JAVA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The GitHub release is not a store like the other two: it needs the tag to
  # exist, so it runs AFTER the tag job. That ordering would normally make it
  # unreplayable, since `check` refuses everything once the release tag is out
  # — so this job deliberately does NOT gate on check.outputs.publish. It runs
  # whenever the guards passed, a re-run of an already released version
  # included, and decides for itself whether anything is left to do. Deleting
  # the release and re-running therefore recreates it.
  #
  # `gh release view` replaces the marker tag here: the markers exist because
  # CurseForge's listing API needs a key the upload token is not, while the
  # GitHub API is free, authenticated by github.token, and authoritative.
  publish-github:
    name: Publish the GitHub release
    needs: [config, check, matrix, tag]
    if: >-
      always()
      && needs.config.outputs.release == 'true'
      && contains(needs.config.outputs.stores, 'github')
      && needs.check.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.config.outputs.tag }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - uses: actions/checkout@v7
        with:
          # the tags are what the generated notes diff against
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: spatulox-minecraft/mc-bump
          ref: ${{ inputs.mc-bump-ref }}
          path: .mc-bump

      - name: Is there anything left to do?
        id: marker
        run: |
          set -euo pipefail
          skip() {
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "$DRY_RUN" = "true" ]; then
            skip "### Dry run: GitHub release skipped."
            exit 0
          fi

          # No tag, nothing to hang a release on.
          if [ -z "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            skip "### GitHub: \`$TAG\` is not tagged, no release to create."
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            skip "### GitHub: release \`$TAG\` already exists, skipping."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        if: steps.marker.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: ${{ needs.config.outputs.java }}
      - uses: gradle/actions/setup-gradle@v5
        if: steps.marker.outputs.skip != 'true'

      - name: Install PyYAML
        if: steps.marker.outputs.skip != 'true'
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      # The matrix keeps logs, not jars, and on a replay it is skipped
      # altogether, so the release builds its own artifacts.
      - name: Build the jars
        if: steps.marker.outputs.skip != 'true'
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew build --stacktrace

          # The sources jar only exists when the build script asks for it
          # (`java { withSourcesJar() }`). Its absence is a warning below, not a
          # failed release, so a build script without it must not break here.
          if ! ls build/libs/*-sources.jar >/dev/null 2>&1; then
            ./gradlew sourcesJar --console=plain || true
          fi

      - name: Write the release notes
        if: steps.marker.outputs.skip != 'true'
        run: |
          set -euo pipefail
          prop() { sed -n "s/^$1=//p" gradle.properties | head -n 1 | tr -d '[:space:]'; }

          MC="$(prop minecraft_version)"
          SUPPORTED="$(prop supported_minecraft_versions)"
          JAVA="$(prop java_version)"
          RANGE="$(PYTHONPATH=.mc-bump python3 -c "
          from lib.config import load
          project = load()
          print(project.loader.read_depends(project.paths, project.loader.depends_keys()['minecraft']))
          ")"

          # The same table the tag annotation carries: what this jar was built
          # against, and what it announces.
          {
            echo "| | |"
            echo "|---|---|"
            echo "| Minecraft | \`$MC\` |"
            echo "| supported | \`$SUPPORTED\` |"
            echo "| range | \`$RANGE\` |"
            echo "| Java | \`$JAVA\` |"
            echo
          } > notes.md

          # previous_tag_name is explicit because the per-store marker tags
          # would otherwise be picked as "the previous release".
          PREV="$(git tag --list --sort=-v:refname \
                  | grep -v '^published/' | grep -v -x -F "$TAG" | head -n 1 || true)"
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" ${PREV:+-f previous_tag_name="$PREV"} --jq .body \
            >> notes.md || echo "_Automatic notes unavailable._" >> notes.md

      - name: Create the release
        if: steps.marker.outputs.skip != 'true'
        run: |
          set -euo pipefail

          # -dev jars are the unremapped build outputs; the sources jar ships.
          JARS=()
          for jar in build/libs/*.jar; do
            case "$jar" in *-dev*.jar) continue ;; esac
            if [ -f "$jar" ]; then
              JARS+=("$jar")
            fi
          done
          if [ ${#JARS[@]} -eq 0 ]; then
            echo "::error::no jar in build/libs to attach to the release"
            exit 1
          fi

          # --verify-tag: gh would otherwise create the tag itself, and in this
          # pipeline a tag never precedes a successful publication.
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file notes.md "${JARS[@]}"

          case " ${JARS[*]} " in
            *-sources.jar*) ;;
            *) echo "::warning::no sources jar was built; add java { withSourcesJar() } to ship one" ;;
          esac

          {
            echo "### GitHub release \`$TAG\` published :package:"
            echo
            for jar in "${JARS[@]}"; do
              echo "- \`$(basename "$jar")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  report-failure:
    name: Report the failures
    needs:
      [config, check, matrix, publish-modrinth, publish-curseforge, tag, publish-github]
    if: always() && needs.config.result == 'success' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: spatulox-minecraft/mc-bump
          ref: ${{ inputs.mc-bump-ref }}
          path: .mc-bump

      - uses: ./.mc-bump/.github/actions/report-issue
        with:
          assignee: ${{ needs.config.outputs.assignee }}
          label: ${{ needs.config.outputs.label }}
          log-tail: ${{ needs.config.outputs.log_tail }}
          branch: ${{ github.ref_name }}
          token: ${{ github.token }}
          intro: >-
            The release of `${{ needs.config.outputs.tag }}` did not complete.
            Each store publishes in its own job and skips what is already
            uploaded, so re-running this workflow is safe.
