name: Self test

# mc-bump IS the CI of other repositories, so nothing here may rot unnoticed. The
# shell scripts in particular carry the whole test logic and were never linted
# while they lived in a mod's repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      # -t . so the tests import lib.* the same way the scripts do
      - name: Run the tests
        run: python3 -m unittest discover -s tests -t . --verbose

      # The config is what every mod writes by hand, so the example in the README
      # has to stay loadable.
      - name: The README example still validates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib, tempfile, sys, json
          sys.path.insert(0, ".")
          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          blocks = re.findall(r"```yaml\n(loader:.*?)```", readme, re.S)
          if not blocks:
              sys.exit("no config example found in README.md")
          from lib.config import _validate, SCHEMA
          import yaml
          for block in blocks:
              _validate(yaml.safe_load(block), SCHEMA)
          print(f"{len(blocks)} config example(s) validated")
          PY

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
      - name: Lint the scripts
        run: shellcheck --severity=warning scripts/*.sh

  actions:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Lint the workflows
        run: ./actionlint -color
