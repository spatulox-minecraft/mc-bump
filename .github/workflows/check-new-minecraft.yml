name: New Minecraft version

on:
  schedule:
    # Wednesday 06:00 UTC, aligned with Mojang's release rhythm
    - cron: '0 6 * * 3'
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: "Force a specific Minecraft version (e.g. 26.2). Empty = latest release."
        required: false
        type: string
      force:
        description: "Continue even if the repo is already on that version"
        required: false
        type: boolean
        default: false

concurrency:
  group: mc-update
  cancel-in-progress: false

# issues: write is needed both to open the failure issue and to create the
# minecraft-update label (gh pr create --label fails when the label is missing).
permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  BRANCH_PREFIX: chore/mc-

jobs:
  update-and-test:
    name: Detect, update and test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # All the version resolution and file editing lives in
      # scripts/update-mc-version.py, so that CI and local use share exactly the
      # same code. The script fills in $GITHUB_OUTPUT by itself.
      - name: Resolve and apply versions
        id: update
        env:
          INPUT_MC: ${{ inputs.minecraft_version }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          ARGS=()
          if [ -n "${INPUT_MC:-}" ]; then ARGS+=("$INPUT_MC"); fi
          if [ "${INPUT_FORCE:-false}" = "true" ]; then ARGS+=(--force); fi

          rc=0
          python3 scripts/update-mc-version.py ${ARGS[@]+"${ARGS[@]}"} || rc=$?

          # 0 = ok / already up to date, 2 = Fabric not ready yet (normal exit),
          # 1 = real error (network, missing key...)
          if [ "$rc" -eq 1 ]; then
            echo "::error::version resolution failed"
            exit 1
          fi

      - name: Summary
        if: steps.update.outputs.status != 'updated'
        env:
          STATUS: ${{ steps.update.outputs.status }}
          MC: ${{ steps.update.outputs.minecraft_version }}
        run: |
          if [ "$STATUS" = "up-to-date" ]; then
            echo "### Already up to date on Minecraft \`$MC\` :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Fabric does not support Minecraft \`$MC\` yet :hourglass:" >> "$GITHUB_STEP_SUMMARY"
            echo "We will retry on the next cron run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Applied diff
        if: steps.update.outputs.status == 'updated'
        run: git --no-pager diff

      # First commit: the dependency bump and the widened compatibility range.
      # The range has to be widened BEFORE the tests, otherwise Fabric Loader
      # refuses to load the mod on the new version's server and no version could
      # ever be validated. It is reverted below if the tests fail.
      - name: Commit the bump
        if: steps.update.outputs.status == 'updated'
        env:
          MC: ${{ steps.update.outputs.minecraft_version }}
          LOADER: ${{ steps.update.outputs.loader_version }}
          FABRIC_API: ${{ steps.update.outputs.fabric_api_version }}
          LOOM: ${{ steps.update.outputs.loom_version }}
          JAVA: ${{ steps.update.outputs.java_version }}
          MOD_VERSION: ${{ steps.update.outputs.mod_version }}
          RANGE: ${{ steps.update.outputs.minecraft_range }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH_PREFIX}${MC}"
          # mixins.json carries compatibilityLevel, which follows java_version
          git add gradle.properties \
                  src/main/resources/fabric.mod.json \
                  src/main/resources/extended-time-potion.mixins.json
          # --force on an already current version resolves to the same values:
          # nothing staged, and no failure under set -e
          git diff --cached --quiet || \
            git commit -m "chore(mc): bump to Minecraft $MC" \
                       -m "fabric-loom $LOOM, java $JAVA, mod_version $MOD_VERSION, depends.minecraft $RANGE" \
                       -m "fabric-loader $LOADER and fabric-api $FABRIC_API are frozen: they only move if the version matrix fails."

      # --- Build + headless test -------------------------------------------
      # After the update step, so the JDK matches the Java version the NEW
      # Minecraft release requires, not the one the repo was on.
      - name: Set up JDK ${{ steps.update.outputs.java_version }}
        if: steps.update.outputs.status == 'updated'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.update.outputs.java_version }}

      - name: Set up Gradle
        if: steps.update.outputs.status == 'updated'
        uses: gradle/actions/setup-gradle@v5

      # One step, not build-then-smoke: the matrix builds AND boots a server for
      # each claimed version in turn. Testing only the newest would leave the
      # older versions of the series completely unverified, although
      # depends.minecraft promises them.
      #
      # The wrapper adds the escalation ladder: the update froze the loader and
      # Fabric API, and this is what unfreezes them, one at a time and only if the
      # matrix is red, re-running it in full after each bump.
      - name: Build and boot every claimed version
        id: tests
        if: steps.update.outputs.status == 'updated'
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x gradlew
          bash .github/scripts/test-with-escalation.sh 2>&1 | tee test-matrix.log

      # steps.update.outputs carries the PRE-escalation versions: it ran before the
      # ladder had a chance to bump anything. Everything downstream that reports a
      # dependency version reads it back from gradle.properties here instead.
      - name: Read the final dependency versions
        id: final
        if: steps.update.outputs.status == 'updated'
        run: |
          set -euo pipefail
          prop() { sed -n "s/^$1=//p" gradle.properties | head -n 1 | tr -d '[:space:]'; }

          {
            echo "loader_version=$(prop loader_version)"
            echo "fabric_api_version=$(prop fabric_api_version)"
          } >> "$GITHUB_OUTPUT"

          # One markdown row per escalated dependency, empty when the frozen pair
          # was enough. Consumed by the PR body and the failure issue.
          # touch: the ladder truncates the file on start, but it never got that
          # far if the test step died on its very first command.
          touch test-escalation.txt
          ESCALATED=""
          while read -r KEY BEFORE AFTER; do
            [ -n "${KEY:-}" ] || continue
            ESCALATED="$ESCALATED| \`$KEY\` | \`$BEFORE\` -> \`$AFTER\` |"$'\n'
          done < test-escalation.txt

          {
            echo "escalated<<ESCALATION_EOF"
            echo "$ESCALATED"
            echo "ESCALATION_EOF"
          } >> "$GITHUB_OUTPUT"

      # This is where, and nowhere else, compatibility is asserted:
      # supported_minecraft_versions drives what is announced on Modrinth and
      # CurseForge, so it is only written after proof that the mod works (build +
      # server starting + potions and brewing verified in the log).
      #
      # --mark-supported is also where an escalated dependency becomes a
      # requirement of the mod (depends."fabric-api" = ">=…"), so this commit
      # picks up both the bumped gradle key and its new floor.
      - name: Mark the version as compatible
        if: steps.update.outputs.status == 'updated' && steps.tests.outcome == 'success'
        env:
          MC: ${{ steps.update.outputs.minecraft_version }}
        run: |
          set -euo pipefail
          python3 scripts/update-mc-version.py --mark-supported
          git add gradle.properties src/main/resources/fabric.mod.json

          BODY="$(awk '{ printf "%s %s -> %s\n", $1, $2, $3 }' test-escalation.txt)"
          MESSAGE=(-m "chore(mc): validate Minecraft $MC (build + headless server)")
          if [ -n "$BODY" ]; then
            MESSAGE+=(-m "Needed an escalation of the frozen dependencies:"$'\n'"$BODY")
          fi

          # the version may already be listed on a re-run: no commit, no failure
          git diff --cached --quiet || git commit "${MESSAGE[@]}"

      # Mirror image: the mod does not work, so the branch must not keep claiming
      # it does. Only the compatibility keys are restored; the version bumps,
      # including whatever the escalation ladder tried, are kept as the starting
      # point for a manual fix.
      - name: Revert unproven compatibility
        if: steps.update.outputs.status == 'updated' && steps.tests.outcome != 'success'
        env:
          MC: ${{ steps.update.outputs.minecraft_version }}
        run: |
          set -euo pipefail
          python3 scripts/update-mc-version.py --revert-compat
          git add gradle.properties src/main/resources/fabric.mod.json

          BODY="$(awk '{ printf "%s %s -> %s\n", $1, $2, $3 }' test-escalation.txt)"
          MESSAGE=(-m "chore(mc): revert unproven compatibility for $MC")
          if [ -n "$BODY" ]; then
            MESSAGE+=(-m "Escalation did not help, the bumps are kept anyway:"$'\n'"$BODY")
          fi

          git diff --cached --quiet || git commit "${MESSAGE[@]}"

      - name: Upload logs
        if: steps.update.outputs.status == 'updated'
        uses: actions/upload-artifact@v7
        with:
          name: server-logs-${{ steps.update.outputs.minecraft_version }}
          path: |
            test-matrix.log
            test-escalation.txt
            server-test-*.log
            run/logs/
          retention-days: 30
          if-no-files-found: ignore

      # --- Pull request ----------------------------------------------------
      - name: Write the PR body
        id: body
        if: steps.update.outputs.status == 'updated'
        env:
          MC: ${{ steps.update.outputs.minecraft_version }}
          PREVIOUS: ${{ steps.update.outputs.previous_version }}
          LOADER: ${{ steps.final.outputs.loader_version }}
          FABRIC_API: ${{ steps.final.outputs.fabric_api_version }}
          AVAILABLE_LOADER: ${{ steps.update.outputs.available_loader_version }}
          AVAILABLE_FABRIC_API: ${{ steps.update.outputs.available_fabric_api_version }}
          ESCALATED: ${{ steps.final.outputs.escalated }}
          LOOM: ${{ steps.update.outputs.loom_version }}
          JAVA: ${{ steps.update.outputs.java_version }}
          MOD_VERSION: ${{ steps.update.outputs.mod_version }}
          RANGE: ${{ steps.update.outputs.minecraft_range }}
          TESTS: ${{ steps.tests.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          icon() {
            if [ "$1" = "success" ]; then echo ":white_check_mark:"; else echo ":x:"; fi
          }

          # "frozen" is the normal case and worth saying out loud, so nobody reads
          # an unchanged Fabric API as the automation having forgotten it.
          note() {  # note <in use> <latest available>
            if [ "$1" = "$2" ]; then echo "frozen (already the latest)"
            else echo "frozen (latest available: \`$2\`)"; fi
          }
          LOADER_NOTE="$(note "$LOADER" "$AVAILABLE_LOADER")"
          FABRIC_API_NOTE="$(note "$FABRIC_API" "$AVAILABLE_FABRIC_API")"

          # Written to its own file rather than to a variable: nesting a heredoc
          # inside the one below is exactly the kind of quoting that breaks
          # silently, and the main body can just cat it back.
          : > escalation.md
          if [ -n "$ESCALATED" ]; then
            {
              echo "## Escalation"
              echo
              echo "The matrix failed with the frozen dependencies, so they were bumped one at"
              echo "a time, replaying the **whole** matrix after each bump."
              echo
              echo "| key | from -> to |"
              echo "|---|---|"
              echo "$ESCALATED"
              # blank line, or the paragraph below gets absorbed into the table
              echo
              echo "A bump that fixed the matrix is recorded in \`fabric.mod.json\` as a"
              echo "dependency floor, so a user on an older version is told to update instead"
              echo "of crashing."
              echo
            } > escalation.md
          fi

          # one row per version the matrix actually ran, read from the status file
          # it wrote: --list-test-versions would give the wrong list here, since
          # --revert-compat may already have shortened it.
          MATRIX=""
          while read -r V OUTCOME; do
            [ -n "$V" ] || continue
            case "$OUTCOME" in
              ok)     ROW=":white_check_mark: builds and boots" ;;
              server) ROW=":x: builds, but the server did not start" ;;
              *)      ROW=":x: build failed" ;;
            esac
            MATRIX="$MATRIX| \`$V\` | $ROW |"$'\n'
          done < test-matrix-status.txt

          if [ "$TESTS" = "success" ]; then
            echo "draft=false" >> "$GITHUB_OUTPUT"
            VERDICT=":white_check_mark: **The mod builds and the server starts on every version Minecraft \`$MC\` brings the range to.**"
            COMPAT="\`$RANGE\` — kept, the matrix proved it."
          else
            echo "draft=true" >> "$GITHUB_OUTPUT"
            VERDICT=":x: **The mod does not work as is on Minecraft \`$MC\`** — draft PR, the dependency diff is already done to start from."
            COMPAT="reverted to its previous value — the matrix did not prove \`$RANGE\`."
          fi

          cat > pr-body.md <<EOF
          Automatic update to **Minecraft \`$MC\`** (previous: \`$PREVIOUS\`).

          $VERDICT

          ## Resolved versions

          | | version | |
          |---|---|---|
          | Minecraft | \`$MC\` | the only thing an update moves |
          | Fabric Loader | \`$LOADER\` | $LOADER_NOTE |
          | Fabric API | \`$FABRIC_API\` | $FABRIC_API_NOTE |
          | fabric-loom | \`$LOOM\` | build plugin, follows the latest stable |
          | Java | \`$JAVA\` | from the Mojang manifest |
          | \`mod_version\` | \`$MOD_VERSION\` | |
          | \`depends.minecraft\` | $COMPAT | |

          $(cat escalation.md)

          ## Results, one row per claimed version

          Every version covered by \`depends.minecraft\` is built and booted with the
          resolved dependencies above, not just the newest one.

          | Minecraft | result |
          |---|---|
          $MATRIX
          The full logs of each version are available in the artifacts of the [run]($RUN_URL).

          ## To do by hand before merging

          - [ ] Bump the mod part of \`mod_version\` if this is a release (the Minecraft part, \`${MOD_VERSION%%-*}\`, is updated automatically)
          - [ ] Add a \`## <version>\` entry at the top of \`CHANGELOG.md\` — that is what gets published on Modrinth/CurseForge
          - [ ] Test brewing in game (golden nugget 8:00 -> 11:00, golden carrot 11:00 -> 15:00)

          > \`supported_minecraft_versions\` and \`depends.minecraft\` are both derived from the
          > Minecraft series and are only extended once the build and the headless server test pass.
          > Fabric Loader and Fabric API are **frozen** by an update and only move through the
          > escalation ladder in \`.github/scripts/test-with-escalation.sh\`, so a red matrix has one
          > suspect instead of three. \`loom_version\` follows the latest stable fabric-loom; if the
          > build fails inside loom itself, re-run this workflow after pinning it with
          > \`python3 scripts/update-mc-version.py <version> --loom <loom version>\`.

          ---
          Generated by \`.github/workflows/check-new-minecraft.yml\` via \`scripts/update-mc-version.py\`
          EOF

      # A PR opened with the default GITHUB_TOKEN does NOT trigger pull_request
      # workflows, so ci.yml will not run on this PR. Harmless here: this workflow
      # already builds and smoke-tests the branch itself.
      # Requires Settings > Actions > "Allow GitHub Actions to create and approve
      # pull requests".
      - name: Push and open the pull request
        id: pr
        if: steps.update.outputs.status == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          MC: ${{ steps.update.outputs.minecraft_version }}
          DRAFT: ${{ steps.body.outputs.draft }}
          # The PR targets the ref the workflow ran from. A scheduled run always
          # runs from the default branch, so this is master in production; a manual
          # run from a feature branch targets that branch, which keeps the test PR
          # down to the version bump instead of the whole branch diff.
          BASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BRANCH="${BRANCH_PREFIX}${MC}"
          TITLE="chore: support Minecraft $MC"

          # --force: the branch may survive a previous run of this workflow
          git push --force origin "$BRANCH"

          gh label create minecraft-update \
            --color ededed \
            --description "Automatic Minecraft version update" \
            --force

          PR="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' || true)"
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "$TITLE" --body-file pr-body.md --add-assignee Spatulox
            # || true: gh errors out when the PR is already in the target state
            if [ "$DRAFT" = "true" ]; then
              gh pr ready "$PR" --undo || true
            else
              gh pr ready "$PR" || true
            fi
          else
            DRAFT_FLAG=()
            if [ "$DRAFT" = "true" ]; then DRAFT_FLAG+=(--draft); fi
            gh pr create \
              --base "$BASE" --head "$BRANCH" \
              --title "$TITLE" --body-file pr-body.md \
              --label minecraft-update --assignee Spatulox \
              ${DRAFT_FLAG[@]+"${DRAFT_FLAG[@]}"}
            PR="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')"
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      # --- Failure issue ---------------------------------------------------
      # The draft PR alone notifies nobody. This is what tells Spatulox that a new
      # Minecraft version broke the mod. The title is deterministic so re-runs
      # comment on the existing issue instead of piling up duplicates.
      - name: Open a failure issue
        if: steps.update.outputs.status == 'updated' && steps.tests.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          MC: ${{ steps.update.outputs.minecraft_version }}
          LOADER: ${{ steps.final.outputs.loader_version }}
          FABRIC_API: ${{ steps.final.outputs.fabric_api_version }}
          ESCALATED: ${{ steps.final.outputs.escalated }}
          LOOM: ${{ steps.update.outputs.loom_version }}
          JAVA: ${{ steps.update.outputs.java_version }}
          TESTS: ${{ steps.tests.outcome }}
          PR: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="[auto] Minecraft $MC: the mod does not work"

          # The failing version is not necessarily the newest one: bumping Fabric
          # API can break an OLDER version of the series that the range promises.
          BROKEN="$(awk '$2 != "ok" { printf "%s ", $1 }' test-matrix-status.txt)"

          {
            echo "The automatic update to **Minecraft \`$MC\`** left the mod broken on: **${BROKEN:-unknown}**"
            echo
            echo "| | version |"
            echo "|---|---|"
            echo "| Minecraft | \`$MC\` |"
            echo "| Fabric Loader | \`$LOADER\` |"
            echo "| Fabric API | \`$FABRIC_API\` |"
            echo "| fabric-loom | \`$LOOM\` |"
            echo "| Java | \`$JAVA\` |"
            echo
            # The ladder already tried these, so nobody should waste time
            # suggesting them as the fix.
            if [ -n "$ESCALATED" ]; then
              echo "Bumping the frozen dependencies was already attempted, without success:"
              echo
              echo "| key | from -> to |"
              echo "|---|---|"
              echo "$ESCALATED"
            else
              echo "Fabric Loader and Fabric API are unchanged: either they were already on the"
              echo "newest release for this Minecraft version, or bumping them was not reached."
              echo
            fi
            echo "| Minecraft | result |"
            echo "|---|---|"
            while read -r V OUTCOME; do
              [ -n "$V" ] || continue
              case "$OUTCOME" in
                ok)     echo "| \`$V\` | :white_check_mark: builds and boots |" ;;
                server) echo "| \`$V\` | :x: builds, but the server did not start |" ;;
                *)      echo "| \`$V\` | :x: build failed |" ;;
              esac
            done < test-matrix-status.txt
            echo
            echo "The compatibility range was reverted on the branch: the mod does not claim to"
            echo "support \`$MC\`. The dependency bump is kept as a starting point."
            echo
            if [ -n "${PR:-}" ]; then
              echo "Draft PR: #$PR"
              echo
            fi
            echo "Full logs in the [run artifacts]($RUN_URL)."
            echo
            echo "<details><summary>Last 100 lines of the matrix</summary>"
            echo
            echo '```'
            tail -n 100 test-matrix.log 2>/dev/null || echo "(no log)"
            echo '```'
            echo
            echo "</details>"
          } > issue-body.md

          # Exact title match on the label, rather than --search: the title
          # contains brackets, which the GitHub search syntax tokenises oddly.
          EXISTING="$(gh issue list --state open --label minecraft-update --limit 100 \
            --json number,title -q ".[] | select(.title == \"$TITLE\") | .number" \
            | head -n 1 || true)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file issue-body.md
            echo "Commented on existing issue #$EXISTING" >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create \
              --title "$TITLE" --body-file issue-body.md \
              --assignee Spatulox --label minecraft-update
          fi
